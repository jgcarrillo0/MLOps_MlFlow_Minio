services:
  postgres-mlflow:
    image: postgres:16
    container_name: covertype-postgres-mlflow
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME}
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    networks:
      - mlops-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MLFLOW_DB_USER} -d ${MLFLOW_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-data:
    image: postgres:16
    container_name: covertype-postgres-data
    environment:
      POSTGRES_USER: ${DATA_DB_USER}
      POSTGRES_PASSWORD: ${DATA_DB_PASSWORD}
      POSTGRES_DB: ${DATA_DB_NAME}
    volumes:
      - covertype_postgres_data:/var/lib/postgresql/data
    networks:
      - mlops-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATA_DB_USER} -d ${DATA_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: pgsty/minio:latest
    container_name: covertype-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8024:9000"
      - "8023:9001"
    volumes:
      - minio_data:/data
    networks:
      - mlops-network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:latest
    container_name: covertype-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set mlflow http://minio:9000
      ${MINIO_ROOT_USER}
      ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing mlflow/${MINIO_BUCKET}
      "
    networks:
      - mlops-network
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    container_name: covertype-mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1

      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow:5000, localhost:*, 10.43.97.95:8022
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: http://10.43.97.95:8022, http://localhost:5001
      
    command:
      [
        "uv",
        "run",
        "--no-sync",
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "postgresql+psycopg://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres-mlflow:5432/${MLFLOW_DB_NAME}",
        "--default-artifact-root",
        "${MLFLOW_ARTIFACT_ROOT}",
      ]
    ports:
      - "8022:5000"
    depends_on:
      postgres-mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - mlops-network
    restart: unless-stopped

  jupyter:
    build:
      context: .
      dockerfile: jupyter/Dockerfile
    container_name: covertype-jupyter
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1

      DATA_DB_USER: ${DATA_DB_USER}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD}
      DATA_DB_NAME: ${DATA_DB_NAME}
      DATA_DB_HOST: postgres-data
      DATA_DB_PORT: 5432

      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS}
    ports:
      - "8021:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./src:/workspace/src
    depends_on:
      postgres-data:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: covertype-api
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1

      MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS}
    ports:
      - "8025:8025"
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - mlops-network
    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow_postgres_data:
  covertype_postgres_data:
  minio_data: